<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email Detector</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'frontend/styles.css' %}">
</head>
<body>
  <main class="container">
    <header>
      <h1><a href="{% url 'index' %}">Email Detector</a></h1>
      <nav>
        {% if user.is_authenticated %}
          <a href="{% url 'history' %}">History</a>
          <a href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a href="{% url 'login' %}">Login</a>
          <a href="{% url 'register' %}">Register</a>
        {% endif %}
      </nav>
    </header>

    {% if messages %}
      <ul class="messages">
        {% for m in messages %}
          <li class="msg {{ m.tags }}">{{ m }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}

    <footer>
      <small>Server-side MVC frontend — backend on same host</small>
    </footer>
  </main>
</body>
</html>
