{% extends 'frontend/base.html' %}

{% block title %}Вход | EmailGuard AI{% endblock %}

{% block content %}
<section class="reveal mx-auto max-w-xl rounded-3xl border border-white/15 bg-white/5 p-6 backdrop-blur-xl md:p-8" data-reveal>
  <p class="text-sm uppercase tracking-[0.2em] text-cyan-300/85">Авторизация</p>
  <h2 class="font-display mt-2 text-3xl font-bold md:text-4xl">С возвращением</h2>
  <p class="mt-2 text-sm text-white/70">Войдите, чтобы анализировать новые email-угрозы и смотреть историю сканов.</p>

  <form method="post" class="mt-8 space-y-4">
    {% csrf_token %}
    <label class="block text-sm text-white/80">Email
      <input name="email" placeholder="Email" required class="mt-2 min-h-[44px] w-full rounded-xl border border-white/15 bg-[#0e1422]/85 px-4 text-white placeholder:text-white/45 focus:outline-none focus:ring-2 focus:ring-cyan-300/50" />
    </label>
    <label class="block text-sm text-white/80">Пароль
      <input name="password" type="password" required class="mt-2 min-h-[44px] w-full rounded-xl border border-white/15 bg-[#0e1422]/85 px-4 text-white placeholder:text-white/45 focus:outline-none focus:ring-2 focus:ring-cyan-300/50" />
    </label>

    <button type="submit" class="btn-glow min-h-[44px] w-full rounded-xl bg-gradient-to-r from-cyan-500 to-teal-400 px-5 py-3 font-semibold text-[#021116]">Войти</button>
  </form>

  <p class="mt-5 text-sm text-white/70">
    Нет аккаунта?
    <a href="{% url 'register' %}" class="font-medium text-cyan-200 hover:text-cyan-100">Создать аккаунт</a>
  </p>
</section>
{% endblock %}
